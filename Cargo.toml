[workspace]
resolver = "2"
members = ["src/foundation", "internal/cbm"]

[workspace.package]
version = "0.10.8"
edition = "2021"
license = "MIT"

[workspace.dependencies]
libc = "0.2"
regex = "1"
tree-sitter = "0.25"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"

[profile.release]
opt-level = 3
lto = "thin"

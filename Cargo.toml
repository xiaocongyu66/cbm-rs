[workspace]
resolver = "2"
members = ["src/foundation", "internal/cbm"]

[workspace.package]
version = "0.10.8"
edition = "2021"
license = "MIT"

[workspace.dependencies]
libc = "0.2"
regex = "1"
tree-sitter = "0.25"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.23"
lz4_flex = "0.11"
zstd = "0.13"
zstd-safe = "7"
tree-sitter-jinja2 = "0.0.16"

[profile.release]
opt-level = 3
lto = "thin"
